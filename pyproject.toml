[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apt-detection-iiot"
version = "0.1.0"
description = "Combined multi-signal APT detection research prototype"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<4.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
